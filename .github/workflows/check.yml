name: Vérifier le site
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in https://studiobega.be https://www.studiobega.be https://new.studiobega.be; do
            for u in / /habitat/ /studio.html /contact.html /build.json /esplanadebouillon /touratour; do
              r=$(curl -sS -o /dev/null -m 20 -w "%{http_code} %{redirect_url} %{time_total}s" "$h$u" 2>&1 || true); echo "::notice::$h$u -> $r"
            done
          done
          for h in https://studiobega.be https://new.studiobega.be; do
            v=$(curl -sS -m 20 "$h/" | grep -c 'id="voice"' || true)
            a=$(curl -sS -o /dev/null -m 20 -w "%{http_code} %{content_type} %{size_download}" "$h/audio/bouillon.m4a" || true)
            j=$(curl -sS -m 20 "$h/assets/site.js" | grep -c 'hush' || true)
            c=$(curl -sSI -m 20 "$h/assets/site.js" | grep -i -E 'cache-control|expires|last-modified' | tr '\r\n' '  ' || true)
            echo "::notice::$h voix-html=$v audio=[$a] js-voix=$j cache=[$c]"
          done
