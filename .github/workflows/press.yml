name: Photos presse
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests pillow
      - run: python3 press_photos.py
        env: {AIRTABLE_TOKEN: '${{ secrets.AIRTABLE_TOKEN }}'}
      - run: |
          git config user.name "studiobega-bot"; git config user.email "bot@studiobega.be"
          git checkout --orphan presse-photos
          git rm -rq --cached . ; git add press/web press/hd
          git commit -qm "Photos presse"
          git push -f origin presse-photos
