name: Publier le site

on:
  workflow_dispatch:        # bouton « Run workflow » (ou Claude)
  schedule:
    - cron: '*/5 * * * *'   # toutes les 5 min : on regarde si Airtable a bougé (fiches, photos, ordre), on ne reconstruit que si oui — dépôt public, minutes gratuites
    - cron: '17 2 * * *'    # chaque nuit, 03:17 heure belge (hiver) : reconstruction complète, quoi qu'il arrive (filet de sécurité)
  push:
    branches: [main]        # toute modification du code republie

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  # Airtable a-t-il changé depuis la dernière publication ? (empreinte de la vue « Site » vs build.json en ligne)
  # Push, bouton et reconstruction de nuit : on publie sans condition.
  veille:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: c
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL || 'https://new.studiobega.be' }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "17 2 * * *" ]; then
            echo "go=1" >> $GITHUB_OUTPUT; echo "::notice::Publication demandée (${{ github.event_name }})"; exit 0
          fi
          pip install --quiet requests
          airtable=$(python3 empreinte.py)
          enligne=$(curl -sS -m 20 "$SITE_URL/build.json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("empreinte",""))' 2>/dev/null || true)
          if [ "$airtable" = "$enligne" ]; then
            echo "go=0" >> $GITHUB_OUTPUT; echo "::notice::Rien de neuf dans Airtable"
          else
            echo "go=1" >> $GITHUB_OUTPUT; echo "::notice::Airtable a changé → on publie"
          fi

  build-deploy:
    needs: veille
    if: needs.veille.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet requests pillow

      - name: Cache des photos déjà réduites
        uses: actions/cache@v4
        with:
          path: data/photos
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      - name: Lire Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 fetch_airtable.py

      - name: Construire le site
        run: python3 build_site.py

      - name: Déposer chez Infomaniak (SFTP)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ vars.FTP_HOST || 'kx5isg.ftp.infomaniak.com' }}
          SITE_DIR: ${{ vars.SITE_DIR || 'sites/new.studiobega.be' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USER","$FTP_PASSWORD" "sftp://$FTP_HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --delete --verbose=1 --parallel=4 dist/ $SITE_DIR/;
            quit"

      - name: Résumé
        run: |
          echo "### Site publié" >> $GITHUB_STEP_SUMMARY
          echo "$(cat dist/*/index.html | grep -c '<template id=\"f-' || true) lieux · $(find dist/img -name '*.jpg' | wc -l) images" >> $GITHUB_STEP_SUMMARY
